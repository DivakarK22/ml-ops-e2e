apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-e2e-api
  namespace: ml-e2e
  labels:
    app: ml-e2e-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-e2e-api
  template:
    metadata:
      labels:
        app: ml-e2e-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ml-e2e-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODEL_ARTIFACT_DIR
              value: /var/ml/artifacts
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi