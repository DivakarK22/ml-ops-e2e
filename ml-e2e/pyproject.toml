[project]
name = "ml-e2e"
version = "0.1.0"
description = "End-to-end AI/ML learning path with OSS tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "transformers>=4.40",
  "chromadb>=0.5",
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-chroma>=0.1",
  "langchain-huggingface>=0.1",
  "langgraph>=0.2",
  "langfuse>=2.0",
  "mlflow>=2.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "sentence-transformers>=3.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "jupyterlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ml-e2e-serve = "ml_e2e.serve:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"